[package]
name = "inkling-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "inklingrs"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
inkling-core.workspace = true
inkling-metal.workspace = true

[dev-dependencies]
# `test-support` for the committed activation dump, which is where the recorded
# prompt and the oracle's continuation live.
inkling-core = { workspace = true, features = [ "test-support" ] }
tempfile.workspace = true
