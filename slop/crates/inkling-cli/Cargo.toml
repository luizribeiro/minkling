[package]
name = "inkling-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "inklingrs"
path = "src/main.rs"

# Two builds of the engine weighed against each other, and the arms it weighs.
# In this crate rather than beside it because it drives the same `backend` and
# `config` the command does, and a measurement of an engine nobody runs is worth
# nothing.
[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tiny_http.workspace = true
inkling-core.workspace = true
inkling-metal.workspace = true

[features]
# Reading a response the way a client does, for the tests at either end of the
# server: the ones inside the modules and the checkpoint-gated one in `tests/`,
# which links this crate from outside. Depending on ourselves turns it on for
# every test target and leaves it off in the shipped binary, the same way
# `inkling-core` does it for the reference fixtures.
test-support = []

[dev-dependencies]
# `test-support` for the committed activation dump, which is where the recorded
# prompt and the oracle's continuation live.
inkling-core = { workspace = true, features = [ "test-support" ] }
inkling-cli = { path = ".", features = [ "test-support" ] }
tempfile.workspace = true
