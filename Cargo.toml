[workspace]
resolver = "3"
members = [ "crates/*" ]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
inkling-core = { path = "crates/inkling-core" }
inkling-metal = { path = "crates/inkling-metal" }

anyhow = "1"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
