[workspace]
resolver = "3"
members = [ "crates/*" ]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
inkling-core = { path = "crates/inkling-core" }
inkling-metal = { path = "crates/inkling-metal" }

anyhow = "1"

# `sysconf(_SC_PAGESIZE)`, and nothing else. Metal takes the bounds of a no-copy
# wrap in pages and raises an Objective-C exception for bounds that are not — an
# exception that unwinds through no Rust destructor — so the page size has to be
# asked for rather than written down.
libc = "0.2"
memmap2 = "0.9"
safetensors = "0.6"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

# Loads the checkpoint's `tokenizer.json` as it stands. The default features
# would build oniguruma and esaxx through `cc`; `fancy-regex` is the pure-Rust
# regex engine the same crate offers instead, and nothing here needs a progress
# bar or a trainer.
tokenizers = { version = "0.23", default-features = false, features = [ "fancy-regex" ] }

# The Metal bindings. `objc2` generates them from Apple's own headers and is the
# ecosystem `metal-rs` itself now redirects to — that crate's README calls
# itself deprecated because the `objc` runtime under it is unmaintained, and
# `objc` has had no release since 2019. Zlib OR Apache-2.0 OR MIT, and eight
# crates against `metal-rs`'s fifteen once its three proc-macro dependencies are
# counted.
#
# The bindings are one Rust module per Metal header, gated by a feature of the
# same name, and the default turns on all hundred of them. Naming the eleven
# this backend calls into keeps the compiled surface to what it uses; a kernel
# that reaches for a header not listed here fails to resolve rather than
# silently widening the build.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSData",
  "NSError",
  "NSRange",
  "NSString",
] }
objc2-metal = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  # `GPUStartTime` and `GPUEndTime`, which are `CFTimeInterval` and so are
  # gated on Core Foundation's own bindings. They are the only clock that can
  # say how much of a submission was the GPU executing rather than this process
  # waiting, and telling those apart is what decides whether a step is short of
  # arithmetic or short of work to overlap it with.
  "objc2-core-foundation",
  "MTLAllocation",
  "MTLBuffer",
  "MTLCommandBuffer",
  "MTLCommandEncoder",
  "MTLCommandQueue",
  "MTLComputeCommandEncoder",
  "MTLComputePass",
  "MTLComputePipeline",
  "MTLCounters",
  "MTLDevice",
  "MTLLibrary",
  "MTLResource",
  "MTLTypes",
] }

# The socket and the request parser under `serve`, and nothing else: a blocking
# accept loop, which is what a server that holds one 16.7 GiB model and decodes
# one request at a time actually is. Four transitive crates — `ascii`,
# `chunked_transfer`, `httpdate`, `log` — against the ~100 an async stack brings,
# and no executor to pretend a 9 s CPU decode step can be awaited. TLS is behind
# a feature this does not turn on.
tiny_http = { version = "0.12", default-features = false }

# The CPU ops are scalar loops, and a test that drives the whole 42-layer stack
# runs tens of gigabytes through them. Unoptimised that is half an hour; this
# makes it minutes. `test` inherits from `dev`, and so does a dependency built
# for a test binary, so this is the setting both need.
[profile.dev]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
