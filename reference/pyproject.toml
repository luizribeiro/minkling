[project]
name = "inkling-ref"
version = "0.1.0"
description = "mlx-vlm reference implementation used as the numerical oracle for inklingrs"
requires-python = "==3.12.*"
dependencies = [
    "mlx-vlm==0.6.8",
    "huggingface-hub>=1.26",
    "numpy",
    # transformers gates InklingProcessor behind the torch backend and
    # InklingImageProcessor behind torchvision, so the tokeniser and the
    # image/audio front end need both. Inference is all MLX.
    "torch",
    "torchvision",
]

[tool.uv]
package = false
