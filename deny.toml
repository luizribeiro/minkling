# This is a deny-by-default snapshot of the resolved legacy graph. Cargo.lock
# remains the authority on versions; this list makes a new crate name an
# explicit policy change. Workspace packages are reviewed in this repository.
#
# TODO(slop-boundary): Set `allow-workspace = false` and explicitly allow each
# reviewed local package after replacing Cargo's workspace glob. The current
# combination automatically trusts a newly generated crate under `slop/crates`.
# TODO(slop-dependencies): Use versioned PackageSpecs with reasons. A name-only,
# graph-wide allowlist also lets slop promote an already-allowed transitive
# crate to a direct dependency without adding a new name here.
[bans]
allow-workspace = true
allow = [
  "ahash",
  "aho-corasick",
  "anstyle",
  "anyhow",
  "ascii",
  "base64",
  "bit-set",
  "bit-vec",
  "bitflags",
  "block2",
  "castaway",
  "cfg-if",
  "chunked_transfer",
  "clap",
  "clap_builder",
  "clap_derive",
  "clap_lex",
  "compact_str",
  "crossbeam-deque",
  "crossbeam-epoch",
  "crossbeam-utils",
  "daachorse",
  "darling",
  "darling_core",
  "darling_macro",
  "dary_heap",
  "derive_builder",
  "derive_builder_core",
  "derive_builder_macro",
  "dispatch2",
  "either",
  "errno",
  "esaxx-rs",
  "fancy-regex",
  "fastrand",
  "fnv",
  "getrandom",
  "heck",
  "httpdate",
  "ident_case",
  "itertools",
  "itoa",
  # TODO(slop-syscalls): Hide this behind a reviewed platform wrapper; direct
  # libc access can bypass the standard-library capability policy.
  "libc",
  "linux-raw-sys",
  "log",
  "macro_rules_attribute",
  "macro_rules_attribute-proc_macro",
  "memchr",
  "memmap2",
  "minimal-lexical",
  "monostate",
  "monostate-impl",
  "nom",
  "objc2",
  "objc2-core-foundation",
  "objc2-encode",
  "objc2-foundation",
  "objc2-metal",
  "once_cell",
  "paste",
  "pastey",
  "ppv-lite86",
  "proc-macro2",
  "quote",
  "r-efi",
  "rand",
  "rand_chacha",
  "rand_core",
  "rayon",
  "rayon-cond",
  "rayon-core",
  "regex",
  "regex-automata",
  "regex-syntax",
  "rustix",
  "rustversion",
  "ryu",
  "safetensors",
  "serde",
  "serde_core",
  "serde_derive",
  "serde_json",
  "smallvec",
  "spm_precompiled",
  "static_assertions",
  "strsim",
  "syn",
  "tempfile",
  "thiserror",
  "thiserror-impl",
  # TODO(slop-network): Move HTTP ownership to `minkling-cli`, then remove this
  # listener capability from the quarantined crates.
  "tiny_http",
  "tokenizers",
  "unicode-ident",
  "unicode-normalization-alignments",
  "unicode-segmentation",
  "unicode_categories",
  "version_check",
  "wasip2",
  "windows-link",
  "windows-sys",
  "wit-bindgen",
  "zerocopy",
  "zerocopy-derive",
  "zmij",
]
# TODO(slop-dependencies): Change this to `deny` after removing the legacy
# `syn` 2.x/3.x split.
multiple-versions = "warn"
wildcards = "deny"

[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = true
# Nix replaces registry sources with vendored directory sources, which prevents
# cargo-deny from recognizing inherited registry dependencies as used.
unused = "allow"

# Build scripts execute during compilation. Every current script is named so a
# newly introduced one fails review even if its crate was already in the graph.
[bans.build]
# TODO(slop-build): Deny packaged executables and interpreted files after the
# local Cargo source cache is no longer polluted by in-place build artifacts.
# Also set `include-workspace` and `include-dependencies` to true after reviewing
# the resulting baseline; otherwise newly trusted local compile-time code and
# helpers used by build scripts are not scanned.
# executables = "deny"
# interpreted = "deny"
# include-workspace = true
# include-dependencies = true
executables = "allow"
interpreted = "allow"
allow-build-scripts = [
  "ahash",
  "anyhow",
  "crossbeam-deque",
  "crossbeam-epoch",
  "crossbeam-utils",
  "esaxx-rs",
  "getrandom",
  "libc",
  "objc2",
  "paste",
  "proc-macro2",
  "quote",
  "rayon-core",
  "rustix",
  "rustversion",
  "serde",
  "serde_core",
  "serde_json",
  "thiserror",
  "wit-bindgen",
  "zerocopy",
  "zmij",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

